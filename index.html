<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Snake</title>
<style>
body { background: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; image-rendering: pixelated; }
canvas { border: 4px solid #333; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const grid = 20;
let snake = [{x: 10, y: 10}];
let dir = {x: 1, y: 0};
let food = {x: 15, y: 15};
let score = 0;
let gameOver = false;

function drawPixel(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * grid, y * grid, grid-1, grid-1);
}

function loop() {
  if (gameOver) return;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20 || snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver = true;
    alert('Game Over! Score: ' + score);
    location.reload();
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
  } else {
    snake.pop();
  }
  ctx.fillStyle = '#111';
  ctx.fillRect(0,0,400,400);
  snake.forEach((s,i) => drawPixel(s.x, s.y, i===0 ? '#0f0' : '#0a0'));
  drawPixel(food.x, food.y, '#f00');
  setTimeout(loop, 150);
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' && dir.y === 0) dir = {x:0,y:-1};
  if (e.key === 'ArrowDown' && dir.y === 0) dir = {x:0,y:1};
  if (e.key === 'ArrowLeft' && dir.x === 0) dir = {x:-1,y:0};
  if (e.key === 'ArrowRight' && dir.x === 0) dir = {x:1,y:0};
});

loop();
</script>
</body>
</html>
